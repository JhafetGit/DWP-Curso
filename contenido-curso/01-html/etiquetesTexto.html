<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- No tiene importancia semantica -->
    <b>Bold</b>
    <br>
    <!-- Si tiene importancia semantica -->
    <strong>Strong</strong>

    <hr>
    <i>Italic</i>
    <br>
    <em>Enfasis</em>

    <hr>
    <br><small>Texto mas pequeño</small>
    <br><mark>Soy un texto Markado</mark>
    <br><del>Soy un texto borrado</del>
    <br><ins>Soy un texto insertado</ins>
    <br><sub>Soy un subscript</sub>
    <br><p> texto <sup>Soy un superScript</sup></p>
</body>

</html>
