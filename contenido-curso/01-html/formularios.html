<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>

<body>

    <form action="" name="contacto" id="contacto">
        <label for="nombre">Nombre:</label>
        <input type="text" placeholder="Escribe tu nombre" id="nombre">

        <hr>
        <textarea name="mensaje" id="mensaje" placeholder="Mesaje">

        </textarea>
        <hr>

        <label for="pais">Pais:</label>
        <select name="pasis" id="pais">
            <option value=""></option>
            <option value="Mexico">Mexico</option>
            <option value="España">España</option>
            <option value="Argentina">Argentina</option>
        </select>
        <hr>
        <input type="radio" name="idoma" id="español" value="español">
        <label for="español">Español</label>
        <input type="radio" name="español" id="inglés" value="inglés">
        <label for="inglés">Ingles</label>
        <hr>
        <input type="checkbox" name="terminos" id="terminos">
        <label for="terminos">Aceptar terminos y condciones</label>
        <hr>
        <input type="button" value="Enviar Datos">

    </form>

</body>

</html>
