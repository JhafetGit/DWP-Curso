<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inputs</title>
</head>

<body>
    <form action="">
        <input type="email" name="correo" id="correo" placeholder="Correo@Correo.com">
        <hr>
        <input type="password" name="password" id="password" placeholder="Escribe tu contra">
        <hr>
        <input type="number" name="number" id="number" min="1" max="10" value="3">
        <hr>
        <input type="file" name="file" id="file" accept=".png">
        <hr>
        <input type="range" name="range" id="range" min="35" max="100" value="10">
        <hr>
        <input type="color" name="color" id="color">
        <hr>
        <input type="date" name="date" id="date" value="2004-09-04" min="2010-01-01" max="2026-09-04">

        <hr>
        <input type="datetime-local" name="datetime-local" id="datetime-local" value="2004-09-04" min="2010-01-01"
            max="2026-09-04">

        <hr>
        <input type="time" name="time" id="time">
        <hr>
        <input type="hidden" name="hidden" id="hidden">

        <hr>
        <input type="image" name="image" id="image" src="./img/paisaje2.jpg" width="100px">
        <hr>

        <input type="reset" name="reset" id="reset" value="Restablecer 2">

        <hr>
        <input type="submit" value="Enviar">
    </form>
</body>

</html>
