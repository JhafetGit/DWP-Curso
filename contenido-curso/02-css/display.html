<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos Inline y Block</title>
    <link rel="stylesheet" href="display.css">
</head>
<body>
    <!-- Block -->
    <div class="caja inline">
        Hola soy una caja
    </div>

    <p class="caja inline">Hola Soy un parrafo</p>
    <p class="caja inline">Hola Soy un parrafo</p>
    <section>Soy un section</section>

    <!-- Inline -->
    <a href="" class="caja inline-block">Soy un enlace</a>
    <a href="" class="caja inline-block">Soy un enlace</a>
    <img src="../01-html/img/paisaje2.jpg" width="50px" alt="" srcset="" class="inline-block">
    <span class="inline-block">Hola SOy un texto en un span</span>
    <h1 class="none">Holaaa</h1>
</body>
</html>
